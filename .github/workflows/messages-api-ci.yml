name: Messages API tests

on:
  push:
    branches: ['patch/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_BUILD_JOBS: "2"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "0"
  LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
  RUST_MIN_STACK: "8388608"
  PYTHONUTF8: "1"

jobs:
  messages-api:
    if: github.repository == 'mlbv/codex'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Configure Windows checkout
        if: runner.os == 'Windows'
        working-directory: .
        run: git config --global core.longpaths true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
      - name: Configure public Git dependencies
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Select compiler cache namespace
        shell: python
        working-directory: .
        run: |
          import hashlib
          import os
          from pathlib import Path
          import subprocess

          embedded = subprocess.check_output([
              "git", "ls-files", "--stage", "-z", "--",
              "codex-rs/skills/src/assets", ":(glob)codex-rs/state/*migrations/**",
          ])
          prefix = "messages-api-windows-nolto-v1-" if os.name == "nt" else "messages-api-linux-ci-test-v1-"
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              print("SCCACHE_GHA_VERSION=" + prefix + hashlib.sha256(embedded).hexdigest(), file=output)
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: messages-api-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            messages-api-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
            native-integration-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/setup-sccache
        with:
          version: v0.16.0
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - uses: ./.github/actions/setup-msvc-env
        if: runner.os == 'Windows'
        with:
          target: x86_64-pc-windows-msvc
      - name: Audit API dependency features
        working-directory: .
        run: python scripts/daemon_product_features.py --product messages-api --target ${{ matrix.target }} --output artifacts
      - name: Test API response parser behavior
        run: cargo test --locked --profile ci-test --target ${{ matrix.target }} -p codex-api --no-default-features --features messages-api --lib parses_tool_call_input_deltas
      - name: Test API executor runtime
        run: cargo test --locked --profile ci-test --target ${{ matrix.target }} -p codex-code-mode-runtime --no-default-features --features messages-api --lib
      - name: Test startup environment parsing
        run: cargo test --locked --profile ci-test --target ${{ matrix.target }} -p codex-arg0 --lib startup_env
      - name: Test independent stored authentication
        run: cargo test --locked --profile ci-test --target ${{ matrix.target }} -p codex-login --lib stored_auth_ignores_process_credentials_on_load_and_reload
      - name: Test Messages API
        run: cargo test --locked --profile ci-test --target ${{ matrix.target }} -p codex-messages-api --lib
      - name: Check Messages API CLI and app-server binaries
        run: cargo check --locked --profile ci-test --target ${{ matrix.target }} -p codex-cli -p codex-app-server --no-default-features --features codex-cli/messages-api,codex-app-server/messages-api
      - name: Upload API dependency evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: messages-api-feature-graph-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: warn
